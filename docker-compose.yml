services:
  openupsc:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    # Local development may use .env.local. Do not mount private PDF/OCR
    # corpora into production containers; PDF delivery should use hardened
    # R2/S3 runtime data and the /api/answer-source flow.

  # Optional: a reverse proxy can terminate TLS in self-hosted deployments.
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - openupsc
